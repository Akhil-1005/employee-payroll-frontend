<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>Payroll</span>
    </div>
    <h1>Sign in</h1>
    <p class="muted">Manage employees, attendance, leave and payroll.</p>

    @if (reason() === 'expired' && !attempted()) {
      <div class="alert alert--info">Your session has expired. Please sign in again.</div>
    }
    @if (error()) {
      <div class="alert alert--error" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Username or email</span>
        <input class="input" formControlName="username" autocomplete="username" autofocus />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <span class="field__error">Username is required</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <input class="input" type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__error">Password is required</span>
        }
      </label>

      <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
